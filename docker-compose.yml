services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: brain_tumor_backend

    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: brain_tumor_frontend

    ports:
      - "8501:8501"

    depends_on:
      - backend